# Nginx — subdominio para Calculadora BIPV Python (Streamlit)
# Guardar en: /etc/nginx/sites-available/bipv-python
# Activar con: sudo ln -s /etc/nginx/sites-available/bipv-python /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name calc.innovacionquimica.com.co;

    # Redirigir HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calc.innovacionquimica.com.co;

    # Certificado SSL (Certbot lo llena automáticamente con --expand)
    ssl_certificate     /etc/letsencrypt/live/innovacionquimica.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innovacionquimica.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/bipv-python-access.log;
    error_log  /var/log/nginx/bipv-python-error.log;

    # Proxy a Streamlit (puerto 8501)
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket — OBLIGATORIO para Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout  86400;
        proxy_connect_timeout 60;
        proxy_send_timeout  60;

        # Streamlit necesita estos headers para funcionar detrás de proxy
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    # Archivos estáticos de Streamlit
    location /_stcore/ {
        proxy_pass       http://127.0.0.1:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
