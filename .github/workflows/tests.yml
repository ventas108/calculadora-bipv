name: Tests

# Gate de cero tolerancia (25-ago-2026): antes de esto, la suite se corría
# a mano en cada PR e ignoraba una lista fija de "fallos preexistentes"
# (llegó a tener 15). Eso permitió que bugs reales del motor de producción
# (Rsh sin saturar, Vmp con el coeficiente térmico equivocado -- PR #38)
# quedaran sin detectar durante mucho tiempo, aunque YA tenían un test con
# datos de referencia auditados: el test estaba en rojo, pero nadie lo veía
# como una alarma porque no bloqueaba nada. Este workflow corre la suite
# COMPLETA sin ningún --ignore ni lista de excepciones: si algo falla, el
# check de GitHub queda en rojo en el PR, punto. Ningún fallo es "normal".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Regla (25-ago-2026): "fórmula física nueva = test de validación
  # obligatorio en el mismo PR". Job aparte y rápido (sin instalar
  # dependencias de la app) para que falle en segundos, no minutos, si un
  # PR toca una fórmula/constante física del SDM sin traer su test de
  # validación contra una referencia real en el mismo cambio.
  physics-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que las fórmulas físicas tocadas traen su test
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python3 bipv_python/scripts/verificar_fisica_tiene_test.py \
            --base "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    # Límite de seguridad agregado 4-sep-2026: sin esto, GitHub aplica su
    # default (360 min) antes de marcar el job como fallo si algo se cuelga
    # de verdad. Auditoría real ese día (14 corridas consecutivas exitosas,
    # 5-93 min) mostró que la duración varía mucho por contención del
    # runner compartido gratuito -- no por el tamaño del catálogo (local se
    # mantuvo estable en ~20-21 min con el mismo catálogo creciendo). 180
    # min da margen generoso sobre el máximo real observado (93 min) sin
    # dejar un colgado genuino corriendo silenciosamente por horas.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: bipv_python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pandas==2.2.2 (fijado en requirements.txt) salió en abril 2024,
          # antes de Python 3.13 (octubre 2024) -- no tiene binario
          # precompilado para 3.13 en Linux, así que pip intentaría
          # compilarlo desde código fuente y el build falla en el runner.
          # 3.12 sí tiene binario listo para todas las versiones fijadas.
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Correr la suite completa (sin --ignore, sin excepciones)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -v
